name: Build NetHunter Kernel for Red Magic 6S Pro

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - release

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libelf-dev \
            bc \
            bison \
            flex \
            python3 \
            python3-dev \
            git \
            curl \
            wget \
            zip \
            unzip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu
          
          echo "Build dependencies installed successfully"
          aarch64-linux-gnu-gcc --version
      
      - name: Setup Build Environment
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=github-actions
          
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=$KBUILD_BUILD_USER" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST" >> $GITHUB_ENV
          
          echo "Build environment setup complete"
      
      - name: Prepare Kernel Config
        run: |
          echo "Preparing kernel configuration..."
          make O=out ARCH=arm64 lahaina-qgki_defconfig
          
          if [ -f "out/.config" ]; then
            echo "Kernel config prepared successfully"
            cat out/.config | head -20
          else
            echo "Config file not found"
            exit 1
          fi
      
      - name: Build Kernel
        run: |
          echo "Building kernel with system GCC..."
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tail -100
          
          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "Kernel build successful!"
            ls -lh out/arch/arm64/boot/Image
          else
            echo "Warning: Kernel image not found"
          fi
      
      - name: Prepare Build Artifacts
        if: always()
        run: |
          mkdir -p build_artifacts
          
          if [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image build_artifacts/
            echo "Copied kernel image"
          fi
          
          if [ -f "out/arch/arm64/boot/dts/qcom/lahaina.dtb" ]; then
            cp out/arch/arm64/boot/dts/qcom/lahaina.dtb build_artifacts/
            echo "Copied DTB"
          fi
          
          if [ -f "out/.config" ]; then
            cp out/.config build_artifacts/kernel.config
            echo "Copied kernel config"
          fi
          
          cat > build_artifacts/BUILD_INFO.txt << 'EOF'
Build Information
=================
Device: Red Magic 6S Pro (nubia_sm8350)
Architecture: ARM64
Build Date: $(date)
Build Type: ${{ github.event.inputs.build_type }}
Branch: ${{ github.ref_name }}
Commit: ${{ github.sha }}
Toolchain: System GCC (aarch64-linux-gnu)
EOF
          
          echo "Artifacts prepared:"
          ls -la build_artifacts/
      
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ github.run_number }}
          path: build_artifacts/
          retention-days: 7
      
      - name: Build Summary
        if: always()
        run: |
          echo "==================================="
          echo "Build Summary"
          echo "==================================="
          echo "Build Status: ${{ job.status }}"
          echo "Build Number: ${{ github.run_number }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Device: Red Magic 6S Pro (nubia_sm8350)"
          echo "Toolchain: System GCC"
          echo "==================================="
