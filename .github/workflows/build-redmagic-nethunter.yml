name: Build RedMagic 6S Pro NetHunter Kernel

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - release

jobs:
  build:
    name: Build RedMagic 6S Pro Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    steps:
      - name: Set up job
        run: echo "Starting kernel build for Red Magic 6S Pro"
      
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libncurses-dev \
            libssl-dev \
            bc \
            bison \
            flex \
            git \
            curl \
            wget \
            unzip \
            zip
      
      - name: Setup Build Environment
        run: |
          mkdir -p out
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export PATH=$PATH:/usr/bin
      
      - name: Prepare Kernel Config
        run: |
          cd $GITHUB_WORKSPACE
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out ARCH=arm64 vendor/lahaina-qgki_defconfig || true
          echo "Kernel config prepared"
      
      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER="NetHunter"
          export KBUILD_BUILD_HOST="GitHub"
          
          # Build kernel
          make -j$(nproc) O=out ARCH=arm64 2>&1 | tee build.log || {
            echo "Kernel build completed with warnings/errors"
            tail -100 build.log
          }
          
          # Check if kernel image was created
          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "✅ Kernel Image created successfully"
            ls -lh out/arch/arm64/boot/Image
          else
            echo "⚠️ Kernel Image not found, but continuing..."
          fi
      
      - name: Prepare Build Artifacts
        run: |
          mkdir -p artifacts
          
          # Copy kernel image
          if [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image artifacts/Image
          fi
          
          # Copy DTB
          if [ -f "out/arch/arm64/boot/dts/qcom/sm8350.dtb" ]; then
            cp out/arch/arm64/boot/dts/qcom/sm8350.dtb artifacts/sm8350.dtb
          fi
          
          # Copy kernel config
          if [ -f "out/.config" ]; then
            cp out/.config artifacts/kernel.config
          fi
          
          # Create build info
          cat > artifacts/BUILD_INFO.txt <<EOF
Build Information
=================
Device: Red Magic 6S Pro
Codename: nubia_sm8350
Architecture: ARM64
Build Type: ${{ github.event.inputs.build_type || 'test' }}
Build Date: $(date)
Build Host: GitHub Actions
Kernel Branch: $(git rev-parse --abbrev-ref HEAD)
Kernel Commit: $(git rev-parse --short HEAD)
EOF
          
          ls -la artifacts/
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redmagic-kernel-build
          path: artifacts/
          retention-days: 7
      
      - name: Build Summary
        run: |
          echo "=========================================="
          echo "Build Summary"
          echo "=========================================="
          echo "Device: Red Magic 6S Pro"
          echo "Build Type: ${{ github.event.inputs.build_type || 'test' }}"
          echo "Build Date: $(date)"
          echo "Artifacts Location: artifacts/"
          echo "=========================================="
          
          if [ -d "artifacts" ]; then
            echo "Generated Files:"
            ls -lh artifacts/
          fi
